<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure PDF Access</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="brand-icon">PDF</div>

    <h1>Protected Document</h1>

    <p id="pdfTitle">Enter the password to access this document.</p>

    <form id="pdfPasswordForm">
      <label>Document Password</label>

      <input
        type="password"
        id="pdfPassword"
        placeholder="Enter PDF password"
        required
      >

      <button type="submit" id="verifyBtn">
        Unlock PDF
      </button>

      <p id="passwordMessage" class="message"></p>
    </form>

    <a href="/" class="back-link">← Back to Search</a>
  </div>

  <script src="/assets/js/pdf-password.js"></script>
</body>
</html>
